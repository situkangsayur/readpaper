<body>
  <div id="app"></div>
  <script>
    (function () {
      // Panel ini berjalan di peramban penulis, jadi ia bisa menghubungi
      // ReadPaper di 127.0.0.1 (peramban menanyakan izin akses jaringan
      // lokal sekali). Dokumennya ditulis lewat Code.js di server Google.
      var api = new ReadPaperApi.Client();
      var controller = ReadPaperGDocs.create({ api: api, call: ReadPaperGDocs.scriptRunner(google.script.run) });
      ReadPaperUI.mount(document.getElementById('app'), { controller: controller, editor: 'Google Docs' });
    })();
  </script>
</body>
