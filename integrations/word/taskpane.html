<!DOCTYPE html>
<!-- Task pane add-in Word ReadPaper. SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReadPaper</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="../core/ui.css" />
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <p class="rp-boot" id="boot">Memuat ReadPaper…</p>
  </div>
  <script>
    // Word 2016/2019 non-langganan memakai Internet Explorer untuk add-in;
    // ReadPaper butuh WebView2 (Microsoft 365 / Office 2021+) atau Word web.
    if (!window.Promise || !window.fetch || !window.TextEncoder) {
      document.getElementById('boot').innerHTML =
        'Versi Word ini memakai mesin peramban lama (Internet Explorer) yang tidak didukung ReadPaper. ' +
        'Pakai Microsoft 365, Office 2021 atau lebih baru, atau Word di peramban.';
      window.READPAPER_UNSUPPORTED = true;
    }
  </script>
  <script src="../core/vendor/citeproc.js"></script>
  <script src="../core/citations.js"></script>
  <script src="../core/readpaper-api.js"></script>
  <script src="../core/controller.js"></script>
  <script src="../core/ui.js"></script>
  <script src="word-adapter.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
