name: Uji ujung ke ujung (desktop)

# Aplikasi asli di Windows sungguhan: menandai teks dengan seret mouse,
# komentar, catatan tempel, format anotasi Zotero, commit git, server sitasi,
# dan inti add-in Word/OnlyOffice (citeproc-js) terhadap server itu. Word
# sendiri tidak ada di runner, jadi lapisan Office.js-nya tidak ikut teruji.
on:
  push:
    tags: ['v*']
    # Cabang uji: dicoba di Windows sebelum dirilis.
    branches: ['uji/**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: flutter pub get

      # Satu berkas per langkah: di Windows, aplikasi dari berkas sebelumnya
      # masih memegang .exe-nya, dan berkas berikutnya gagal dengan "Unable
      # to start the app on the device".
      - name: Tandai, komentar, catatan, sitasi
        run: flutter test integration_test/desktop_annotate_cite_test.dart -d windows --reporter expanded

      - name: Fitur desktop (koleksi, catatan, pembaca, panel berkas, kirim/tarik)
        if: always()
        run: flutter test integration_test/desktop_features_test.dart -d windows --reporter expanded

      - name: Mode presenter (layar audiens, clicker, coretan, penunjuk, catatan)
        if: always()
        run: flutter test integration_test/desktop_presenter_test.dart -d windows --reporter expanded

      - name: Tangkapan layar uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-shots
          path: build/e2e-shots/
          if-no-files-found: ignore
