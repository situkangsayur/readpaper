name: Windows

# Windows tidak bisa dibangun dari Linux: `flutter build windows` menuntut
# Visual Studio dan toolchain MSVC, dan tidak ada jalur silang yang didukung.
# Jadi satu-satunya cara jujur adalah membangunnya di mesin Windows sungguhan,
# dan itulah yang dilakukan alur kerja ini.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag rilis yang akan dilampiri hasilnya (kosongkan untuk hanya membangun)'
        required: false
        default: ''

# Token bawaan alur kerja hanya boleh membaca kecuali diminta. Tanpa baris ini
# langkah terakhirnya gagal dengan "HTTP 403: Resource not accessible by
# integration" — setelah membangun, menguji, dan membungkus semuanya dengan
# benar. Yang dibutuhkan hanya menulis aset rilis.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - run: flutter pub get

      # Diperiksa di sini juga, bukan hanya di CI Linux: paket yang berbeda
      # per platform bisa membuat kode yang sehat di satu sisi gagal di sisi
      # lain, dan itu harus ketahuan sebelum .exe-nya terbit.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      # Git ikut di zip. Sinkronisasi di desktop memakai `git`, dan tanpa ini
      # ReadPaper di Windows yang belum dipasangi Git for Windows hanya bisa
      # berkata "git tidak ditemukan". MinGit adalah git portabel resmi dari
      # Git for Windows (termasuk ssh), git-lfs ditaruh di sampingnya supaya
      # lampiran LFS ikut bisa diambil.
      - name: Ikutkan MinGit dan git-lfs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dest = "build/windows/x64/runner/Release/git"
          gh release download --repo git-for-windows/git --pattern 'MinGit-*-64-bit.zip' --dir mingit
          $zip = Get-ChildItem mingit -Filter 'MinGit-*-64-bit.zip' | Where-Object { $_.Name -notmatch 'busybox' } | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $dest
          gh release download --repo git-lfs/git-lfs --pattern 'git-lfs-windows-amd64-v*.zip' --dir lfs
          Expand-Archive -Path (Get-ChildItem lfs -Filter '*.zip' | Select-Object -First 1).FullName -DestinationPath lfs/x
          $lfs = Get-ChildItem lfs/x -Recurse -Filter 'git-lfs.exe' | Select-Object -First 1
          Copy-Item $lfs.FullName "$dest/mingw64/bin/git-lfs.exe"
          "MinGit: $($zip.Name)"

      # Bukti, sebelum zip-nya terbit: git bawaan berjalan tanpa Git for
      # Windows di PATH, LFS-nya terbaca, dan ia benar-benar bisa meng-clone.
      - name: Uji git bawaan
        shell: pwsh
        run: |
          $git = (Resolve-Path "build/windows/x64/runner/Release/git/cmd/git.exe").Path
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & $git --version
          if ($LASTEXITCODE -ne 0) { throw "git bawaan tidak berjalan" }
          & $git lfs version
          if ($LASTEXITCODE -ne 0) { throw "git lfs bawaan tidak berjalan" }
          & $git clone --depth 1 https://github.com/situkangsayur/latex-doc-test.git uji-clone
          if ($LASTEXITCODE -ne 0) { throw "git bawaan gagal meng-clone" }
          Get-ChildItem uji-clone | Select-Object -First 5

      - name: Versi
        id: versi
        shell: bash
        run: echo "v=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')" >> "$GITHUB_OUTPUT"

      # Yang dibungkus adalah seluruh isi folder Release: readpaper.exe tidak
      # berjalan tanpa `data/` dan DLL di sebelahnya — termasuk pdfium.dll,
      # mesin yang membaca PDF-nya.
      - name: Bungkus jadi zip portabel
        shell: pwsh
        run: |
          $ver = "${{ steps.versi.outputs.v }}"
          $src = "build/windows/x64/runner/Release"
          $out = "dist/readpaper-$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path "$src/*" -Destination $out -Recurse
          Copy-Item -Path "LICENSE" -Destination $out
          @"
          # ReadPaper $ver — Windows x64

          Portabel: jalankan ``readpaper.exe`` dari folder ini. Tidak ada yang
          dipasang, tidak ada yang ditulis ke registry.

          Windows SmartScreen akan memperingatkan karena berkasnya tidak
          ditandatangani secara digital — sertifikat penandatangan kode berbayar,
          dan aplikasi ini gratis. Pilih **More info → Run anyway**.

          Isi folder ini harus tetap bersama: ``readpaper.exe`` tidak berjalan
          tanpa folder ``data`` dan DLL di sebelahnya.

          Folder ``git`` berisi git portabel (MinGit dan git-lfs) untuk sinkronisasi.
          Bila Git for Windows sudah terpasang, yang terpasang itulah yang dipakai.
          "@ | Out-File -FilePath "$out/PASANG.md" -Encoding utf8
          Compress-Archive -Path $out -DestinationPath "dist/readpaper-$ver-windows-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: readpaper-windows-x64
          path: dist/*.zip
          if-no-files-found: error

      # Dilampirkan ke rilis hanya kalau memang ada tag-nya. Membangun tanpa
      # merilis tetap berguna: itu yang membuktikan Windows belum patah.
      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.release_tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          ver="${{ steps.versi.outputs.v }}"
          gh release upload "$tag" \
            "dist/readpaper-$ver-windows-x64.zip#ReadPaper $ver (Windows x64, portabel)" \
            --clobber
