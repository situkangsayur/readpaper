name: readpaper
description: "ReadPaper — Zotero-style paper reader with GitHub sync, highlights and comments. Free software, AGPL-3.0-or-later."
publish_to: 'none'
version: 0.5.0+18

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^3.4.3

  # PDF rendering + text selection
  pdfrx: ^2.5.0
  # Same PDFium module pdfrx loads; used to write ink annotations into an
  # exported copy of a paper.
  pdfium_dart: ^0.2.5

  # Network (backend sinkronisasi Android lewat GitHub REST API)
  http: ^1.6.0
  crypto: ^3.0.7

  # Platform / IO
  path: ^1.9.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  file_picker: ^13.1.0

  # Menulis JPG; dart:ui hanya bisa PNG
  image: ^4.5.4

  # Utils
  collection: ^1.19.1
  meta: ^1.16.0
  intl: ^0.20.3
  uuid: ^4.5.1
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
