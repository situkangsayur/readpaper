name: readpaper
description: "ReadPaper — Zotero-style paper reader with GitHub sync, highlights and comments. Free software, AGPL-3.0-or-later."
publish_to: 'none'
version: 0.23.0+42

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^3.4.3

  # PDF rendering + text selection
  pdfrx: ^2.4.8
  # Same PDFium module pdfrx loads; used to write ink annotations into an
  # exported copy of a paper.
  pdfium_dart: ^0.2.5
  # Dipakai langsung untuk menyunting halaman PDF lewat pdfium.
  ffi: ^2.1.3

  # Network (backend sinkronisasi Android lewat GitHub REST API)
  http: ^1.6.0
  crypto: ^3.0.7

  # Platform / IO
  path: ^1.9.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  file_picker: ^13.1.0

  # Menulis JPG; dart:ui hanya bisa PNG
  image: ^4.5.4

  # Membaca gaya dan locale CSL, yang berbentuk XML
  xml: ^7.0.1

  # Utils
  collection: ^1.19.1
  meta: ^1.16.0
  intl: ^0.20.3
  uuid: ^4.5.1
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  printing: ^5.15.1
  # Menulis PDF dengan teks sungguhan — dipakai ekspor Markdown → PDF,
  # yang hasilnya harus tetap bisa dicari dan disalin.
  pdf: ^3.13.1
# Menjauhkan JVM dari seluruh pohon paket.
#
# path_provider_android 2.3.0 mulai memakai paket `jni`, dan `jni` adalah
# plugin FFI — Flutter membangunnya untuk **setiap** platform, termasuk Linux
# tempat ia tidak pernah dipanggil karena yang dipakai path_provider_linux.
# Dua akibatnya nyata dan sudah terbukti: membangun ReadPaper untuk Linux jadi
# menuntut JDK terpasang (ninja berhenti dengan "libjvm.so missing" di
# kontainer Debian 12 yang bersih), dan bundelnya membawa libdartjni.so yang
# tertaut ke libjvm.so sehingga paketnya seolah menuntut Java di mesin
# pemakainya. 2.2.23 adalah rilis terakhir sebelum perubahan itu, dan di
# Android ia bekerja persis sama.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Gaya dan locale CSL, dikelola oleh scripts/csl-style.py. Ikut ke dalam
  # aplikasi supaya sitasi bisa dirender tanpa jaringan — yang sedang menulis
  # di pesawat tetap butuh daftar pustakanya.
  assets:
    - assets/csl/styles.json
    - assets/csl/styles/
    - assets/csl/locales/
