# Teks antarmuka dua bahasa. Templatnya Indonesia (bahasa asli aplikasi);
# English mengikuti kunci yang sama. Jalankan `flutter gen-l10n` (atau
# `flutter pub get`) setelah mengubah berkas ARB.
arb-dir: lib/l10n
template-arb-file: app_id.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# Berkas lib/l10n/app_localizations*.dart adalah keluaran generator: jangan
# dirapikan dengan dart format (lebar barisnya berbeda dan setiap build akan
# membuatnya ulang).
