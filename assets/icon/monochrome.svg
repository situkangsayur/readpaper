<?xml version="1.0" encoding="UTF-8"?>
<!-- Themed-icon layer for Android 13+. The launcher recolours it and draws it
     small, so this is a silhouette rather than the full colour artwork.
     The marker stops short of the right edge on purpose: a stroke crossing the
     whole page would cut the silhouette into separate blocks. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <mask id="halo">
    <rect width="108" height="108" fill="black"/>
    <g transform="rotate(-6 54 54)">
      <rect x="31" y="24" width="46" height="60" rx="5" fill="white"/>
      <!-- thin gap around the stroke so the two shapes stay readable -->
      <rect x="22" y="50" width="45" height="12" rx="3" fill="black"/>
    </g>
  </mask>
  <rect width="108" height="108" fill="#000000" mask="url(#halo)"/>
  <g transform="rotate(-6 54 54)">
    <rect x="24" y="52" width="41" height="8" rx="4" fill="#000000"/>
  </g>
</svg>
